name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.12"
      - name: Install
        run: uv sync --locked
      - name: Secret scan
        run: python3 scripts/check_secrets.py --tracked
      - name: Lint
        run: uv run ruff check .
      - name: Tests (determinism, replay, zero-difference, placebo, invariance, invariants)
        run: uv run pytest
